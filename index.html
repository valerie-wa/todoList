<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript To-Do List</title>
    <link rel="stylesheet" href="style.css"> <!--always goes in head-->
</head>
<body>
    <div id="todo-app">
        <h1>To-do List</h1>
        <form id="todoForm">
            <input type="text" id="taskInput" placeholder="Add a new task">
            <button id="addTaskButton">Add Task</button>
        </form>
        <ul id="todoList">

        </ul>
    </div>
    <script src="script.js"></script><!--always goes at end of body-->
</body>
</html>
